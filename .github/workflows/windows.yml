name: Windows EXE
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Capture real WPF panel screenshots (fictional sample records)
        shell: pwsh
        run: dotnet run --project tests/Hakedis.UiSmoke -c Release -- dist/ui-screenshots --capture-screenshots
      - name: Upload real WPF panel screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gercek-WPF-Ekran-Goruntuleri
          path: dist/ui-screenshots/Gercek-WPF-*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Test and package Windows x64
        shell: pwsh
        run: ./scripts/Publish-Windows.ps1
      - name: Build clean portable and installer release assets
        shell: pwsh
        run: ./scripts/Build-ReleaseAssets.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Ucretli-Ek-Ders-Windows-x64
          path: |
            dist/Ek-Ders-Hakedis-Sistemi-*-win-x64.zip
            dist/installer/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
